<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>ProjectTime - Projets</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Styles (Flask version) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>

  <!-- BARRE DU HAUT -->
  <div class="topbar">
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-folder-tree"></i></div>
      <div>ProjectTime</div>
    </div>

    <div class="top-nav">
      <button class="active" onclick="location.href='{{ url_for('projects') }}'">
        <i class="fa-solid fa-folder-open"></i> Projets
      </button>
      <button onclick="location.href='{{ url_for('gantt') }}'">
        <i class="fa-solid fa-bars-staggered"></i> Gantt
      </button>
      <button onclick="location.href='{{ url_for('time') }}'">
        <i class="fa-regular fa-clock"></i> Temps
      </button>
    </div>

    <div class="user-pill">
      <div class="avatar">D</div>
      <div class="user-info">
        <div>drtgdtr</div>
        <small>Employé</small>
      </div>
    </div>
  </div>

  <!-- CONTENU PRINCIPAL -->
  <div class="content">

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
      <div>
        <div class="page-title">Gestion de Projets</div>
        <div class="page-subtitle">Gérez vos projets et tâches efficacement</div>
      </div>

      <!-- Bouton pour ouvrir la modale -->
      <button class="btn-dark" onclick="openModal('projectModal')">
        <i class="fa-solid fa-plus"></i> Nouveau Projet
      </button>
    </div>

    <!-- STATISTIQUES -->
    <div class="cards-grid">
      <div class="stat-card">
        <div class="stat-icon" style="background:#e7f0ff;color:#1e90ff;">
          <i class="fa-solid fa-layer-group"></i>
        </div>
        <div class="stat-body">
          <div class="stat-title">Projets Actifs</div>
          <div class="stat-value">0</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon" style="background:#dcfce7;color:#15803d;">
          <i class="fa-solid fa-circle-check"></i>
        </div>
        <div class="stat-body">
          <div class="stat-title">Tâches Terminées</div>
          <div class="stat-value">0</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon" style="background:#ffedd5;color:#ea580c;">
          <i class="fa-regular fa-clock"></i>
        </div>
        <div class="stat-body">
          <div class="stat-title">En Cours</div>
          <div class="stat-value">2</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon" style="background:#fee2e2;color:#b91c1c;">
          <i class="fa-solid fa-circle-exclamation"></i>
        </div>
        <div class="stat-body">
          <div class="stat-title">En Retard</div>
          <div class="stat-value">4</div>
        </div>
      </div>
    </div>

  </div>

  <!-- MODALE CREATION NOUVEAU PROJET (Identique à l’image) -->
  <div class="modal-overlay" id="projectModal">
    <div class="modal">
      <div class="modal-title">Nouveau Projet</div>

      <label><div class="form-label">Nom du projet *</div>
        <input type="text" class="form-input" placeholder="Ex : Refonte du site web">
      </label>

      <label><div class="form-label">Description</div>
        <textarea class="form-input" rows="3" placeholder="Décrivez votre projet..."></textarea>
      </label>

      <div style="display:flex;gap:10px;">
        <label style="flex:1;">
          <div class="form-label">Date de début</div>
          <input type="date" class="form-input">
        </label>
        <label style="flex:1;">
          <div class="form-label">Date de fin</div>
          <input type="date" class="form-input">
        </label>
      </div>

      <div class="form-label" style="margin-top:10px;">Couleur du projet</div>
      <div style="display:flex;gap:10px;margin-bottom:8px;flex-wrap:wrap;">
        <div style="width:38px;height:32px;background:#1e90ff;border-radius:12px;border:3px solid #111;"></div>
        <div style="width:38px;height:32px;background:#f97316;border-radius:12px;"></div>
        <div style="width:38px;height:32px;background:#22c55e;border-radius:12px;"></div>
        <div style="width:38px;height:32px;background:#f43f5e;border-radius:12px;"></div>
        <div style="width:38px;height:32px;background:#a855f7;border-radius:12px;"></div>
        <div style="width:38px;height:32px;background:#06b6d4;border-radius:12px;"></div>
      </div>

      <div class="form-label">Membres de l'équipe</div>
      <div style="border:1px solid #e2e8f0;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;">
        <label><input type="checkbox"> Gestionnaire (Gestionnaire)</label>
        <label><input type="checkbox"> Alice Dupont (Employé)</label>
        <label><input type="checkbox"> Bob Martin (Employé)</label>
        <label><input type="checkbox"> drtgdtr (Employé)</label>
      </div>

      <div class="modal-footer">
        <button class="btn-light" onclick="closeModal('projectModal')">Annuler</button>
        <button class="btn-dark">Créer le projet</button>
      </div>
    </div>
  </div>

  <!-- JS (Flask version) -->
  <script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
