<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accueil - ProjectTime</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <!-- Icônes du haut -->
  <div class="icons-top">
    <i class="fa-solid fa-diagram-project blue"></i>
    <i class="fa-solid fa-clock purple"></i>
  </div>

  <!-- Bloc principal -->
  <div class="container container-center">
    <h1>Gestionnaire de Projets et Temps</h1>
    <h2>Gestion de projets et suivi du temps</h2>

    <!-- Onglets type “Connexion / Inscription” -->
  <div class="auth-buttons">
      <button onclick="window.location.href='/login'" class="active">
        <i class="fa-solid fa-right-to-bracket"></i> Connexion
      </button>
      <button onclick="window.location.href='/login'">
        <i class="fa-solid fa-user-plus"></i> Inscription
      </button>
    </div>

    <div class="welcome-desc">
      <p>
        Bienvenue sur votre plateforme de gestion <br>
        des projets et du suivi du temps de travail.
      </p>
    </div>
  </div>

  <!-- Scripts modulaires -->
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
