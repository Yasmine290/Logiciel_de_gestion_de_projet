<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestion de Projets - ProjectTime</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header>
    <div class="nav-left">
      <i class="fa-solid fa-diagram-project"></i>
      <strong>ProjectTime</strong>
    </div>

    <div class="nav-links">
      <button class="active" onclick="window.location.href='/projects'"><i class="fa-solid fa-briefcase"></i> Projets</button>
      <button onclick="window.location.href='/gantt'"><i class="fa-solid fa-chart-gantt"></i> Gantt</button>
      <button onclick="window.location.href='/time'"><i class="fa-solid fa-clock"></i> Temps</button>
      <button id="btnUsers" onclick="window.location.href='/users'" style="display:none;"><i class="fa-solid fa-users"></i> Utilisateurs</button>
    </div>

    <div class="profile">
      <div class="avatar">D</div>
      <div>
        <span>drtgdt</span><br />
        <small>Employé</small>
      </div>
  <button id="btnLogout" class="btn-logout">Déconnexion</button>
    </div>
  </header>

  <main>
    <h2>Gestion de Projets</h2>
    <p>Gérez vos projets et tâches efficacement</p>

    <div class="stats-cards">
      <div class="card">
        <div>
          <strong>0</strong>
          <span>Projets Actifs</span>
        </div>
        <div class="icon blue"><i class="fa-solid fa-diagram-project"></i></div>
      </div>

      <div class="card">
        <div>
          <strong>0</strong>
          <span>Projets Terminés</span>
        </div>
        <div class="icon green"><i class="fa-solid fa-check"></i></div>
      </div>

      <div class="card">
        <div>
          <strong>2</strong>
          <span>En Cours</span>
        </div>
        <div class="icon orange"><i class="fa-solid fa-clock"></i></div>
      </div>

      <div class="card">
        <div>
          <strong>4</strong>
          <span>En Retard</span>
        </div>
        <div class="icon red"><i class="fa-solid fa-triangle-exclamation"></i></div>
      </div>
    </div>

    <br />
  <div class="projects-actions" id="projects-actions">
      <button class="btn-primary" id="btnAddProject" onclick="openModalNouveauProjet()">
        <i class="fa-solid fa-plus"></i> Nouveau Projet
      </button>
    </div>

    <!-- ===== LISTE DES PROJETS ===== -->
    <div id="liste-projets" class="projects-grid">
      <!-- Les cartes de projets seront générées ici par main.js -->
    </div>

    <!-- ===== MODALE AJOUT DE PROJET ===== -->
    <div id="modalProjet" class="modal hidden">
      <div class="modal-content">
  <h3 class="modal-title">
          <i class="fa-solid fa-folder-plus"></i> Nouveau Projet
        </h3>

  <form id="formProjet" class="form-projet">
          <!-- Nom du projet -->
          <div>
            <label style="font-weight:600;">Nom du projet *</label>
            <input id="nomProjet" type="text" placeholder="Ex: Refonte du site web" required class="input-full" />
          </div>

          <!-- Description -->
          <div>
            <label style="font-weight:600;">Description</label>
            <textarea id="descProjet" placeholder="Décrivez votre projet..." class="textarea-full"></textarea>
          </div>

          <!-- Dates -->
          <div class="form-row">
            <div style="flex:1;">
              <label style="font-weight:600;">Date de début</label>
              <input id="dateDebut" type="date" class="input-full" />
            </div>
            <div style="flex:1;">
              <label style="font-weight:600;">Date de fin</label>
              <input id="dateFin" type="date" class="input-full" />
            </div>
          </div>
          <!-- Statut du projet -->
          <div>
            <label style="font-weight:600;">Statut du projet</label>
            <select id="statutProjet" class="input-full">
              <option>À faire</option>
              <option>En cours</option>
              <option>Terminé</option>
              <option>En retard</option>
            </select>
          </div>

          <!-- Couleur du projet -->
          <div>
            <label style="font-weight:600;">Couleur du projet</label>
            <div class="color-swatches">
              <div class="color-swatch" style="background:#2563eb;"></div>
              <div class="color-swatch" style="background:#8b5cf6;"></div>
              <div class="color-swatch" style="background:#22c55e;"></div>
              <div class="color-swatch" style="background:#fb923c;"></div>
              <div class="color-swatch" style="background:#ec4899;"></div>
              <div class="color-swatch" style="background:#3b82f6;"></div>
              <div class="color-swatch" style="background:#14b8a6;"></div>
            </div>
          </div>

          <!-- Membres de l'équipe -->
          <div>
            <label style="font-weight:600;">Membres de l'équipe</label>
            <div id="membresEquipe" class="assigne-equipe">
              <!-- Les membres seront chargés dynamiquement ici -->
            </div>
          </div>

          <!-- Boutons -->
          <div class="form-actions">
            <button type="button" onclick="closeModal('modalProjet')" class="btn-cancel">Annuler</button>
            <button type="submit" id="btnSubmitProject" class="btn-submit">
              <i class="fa-solid fa-plus"></i> Créer le projet
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- ===== MODALE MODIFICATION DE PROJET ===== -->
    <div id="modalModifierProjet" class="modal hidden">
      <div class="modal-content">
  <h3 class="modal-title">
          <i class="fa-solid fa-pen"></i> Modifier le Projet
        </h3>

  <form id="formModifierProjet" class="form-projet">
          <input type="hidden" id="modifIdProjet" />
          
          <!-- Nom du projet -->
          <div>
            <label style="font-weight:600;">Nom du projet *</label>
            <input id="modifNomProjet" type="text" placeholder="Ex: Refonte du site web" required class="input-full" />
          </div>

          <!-- Description -->
          <div>
            <label style="font-weight:600;">Description</label>
            <textarea id="modifDescProjet" placeholder="Décrivez votre projet..." class="textarea-full"></textarea>
          </div>

          <!-- Dates -->
          <div class="form-row">
            <div style="flex:1;">
              <label style="font-weight:600;">Date de début</label>
              <input id="modifDateDebut" type="date" class="input-full" />
            </div>
            <div style="flex:1;">
              <label style="font-weight:600;">Date de fin</label>
              <input id="modifDateFin" type="date" class="input-full" />
            </div>
          </div>
          
          <!-- Statut du projet -->
          <div>
            <label style="font-weight:600;">Statut du projet</label>
            <select id="modifStatutProjet" class="input-full">
              <option>À faire</option>
              <option>En cours</option>
              <option>Terminé</option>
              <option>En retard</option>
            </select>
          </div>

          <!-- Membres de l'équipe -->
          <div>
            <label style="font-weight:600;">Membres de l'équipe</label>
            <div id="modifMembresEquipe" class="assigne-equipe">
              <!-- Les membres seront chargés dynamiquement ici -->
            </div>
          </div>

          <!-- Boutons -->
          <div class="form-actions">
            <button type="button" onclick="closeModal('modalModifierProjet')" class="btn-cancel">Annuler</button>
            <button type="submit" class="btn-submit">
              <i class="fa-solid fa-check"></i> Enregistrer les modifications
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- ===== MODALE DE CONFIRMATION DE SUPPRESSION ===== -->
    <div id="modalConfirmation" class="modal hidden">
  <div class="modal-content confirmation">
  <h3 class="confirmation-title">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </h3>
  <p id="confirmationMessage" class="confirmation-message"></p>
  <p class="confirmation-desc">Cette action est irréversible.</p>
        
        <div class="confirmation-actions">
          <button onclick="annulerSuppression()" class="btn-annuler">Annuler</button>
          <button id="btnConfirmerSuppression" class="btn-confirmer">Oui, supprimer</button>
        </div>
      </div>
    </div>

  </main>

  <!-- Scripts modulaires -->
  <script src="assets/js/main.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/tasks.js"></script>
  <script src="assets/js/projects.js"></script>
  <script src="assets/js/project-details.js"></script>
  <script>
    // Afficher le bouton Utilisateurs uniquement aux admins et gestionnaires
    window.addEventListener('DOMContentLoaded', () => {
      const user = JSON.parse(sessionStorage.getItem('user') || '{}');
      const btnUsers = document.getElementById('btnUsers');
      if (btnUsers && (user.idRole === 1 || user.idRole === 2)) {
        btnUsers.style.display = 'block';
      }
    });
  </script>
</body>
</html>
